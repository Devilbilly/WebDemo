<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小巷咖啡｜線上點餐</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>小巷咖啡</h1>
    <p class="tagline">線上點餐，到店自取</p>
  </header>

  <main class="layout">
    <section class="menu" aria-labelledby="menu-title">
      <h2 id="menu-title">菜單</h2>
      <ul id="menu-list" class="menu-list"></ul>
    </section>

    <aside class="order" aria-labelledby="cart-title">
      <h2 id="cart-title">購物車</h2>
      <ul id="cart-list" class="cart-list"></ul>
      <p id="cart-empty" class="cart-empty">購物車是空的</p>
      <p class="cart-total">合計：<span id="cart-total">NT$0</span></p>

      <form id="checkout" class="checkout" novalidate>
        <h2>取餐資料</h2>
        <label for="name">姓名</label>
        <input id="name" name="name" autocomplete="name">
        <label for="phone">手機號碼</label>
        <input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="0912345678">
        <label for="pickup">取餐時間</label>
        <select id="pickup" name="pickup">
          <option value="12:00">12:00</option>
          <option value="12:30">12:30</option>
          <option value="13:00">13:00</option>
        </select>
        <p id="form-error" class="form-error" role="alert"></p>
        <button id="submit-order" type="submit">送出訂單</button>
      </form>

      <p id="confirmation" class="confirmation" role="status" hidden></p>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
